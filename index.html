<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurban Bayramınız Mübarek Olsun!</title>
    <!-- Konfeti efekti için harici kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #a8ff78, #78ffd6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
        }

        /* Animasyon Alanı */
        .animation-box {
            font-size: 100px;
            margin: 20px 0;
            transition: all 0.5s ease-in-out;
            display: inline-block;
        }

        /* Kesim esnasında koyunun dönme ve küçülme efekti */
        .cut-animation {
            animation: spinAndShrink 0.6s forwards;
        }

        @keyframes spinAndShrink {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(0.5) rotate(180deg); filter: hue-rotate(90deg); }
            100% { transform: scale(0) rotate(360deg); }
        }

        /* Etin büyüme efekti */
        .meat-animation {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1.2); }
        }

        /* Buton Tasarımı */
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Bayram Mesajı */
        .bayram-mesaji {
            font-size: 28px;
            color: #2ed573;
            font-weight: bold;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        .show-message {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="baslik" style="color: #2f3542;">Kurbanlık Seçildi! 🐑</h2>
        
        <div id="kurban-alani" class="animation-box">🐑</div>
        
        <br>
        <button id="kes-btn" onclick="kurbaniKes()">Kurbanı Kes 🔪</button>
        
        <div id="mesaj" class="bayram-mesaji">
            🎉 Kurban Bayramınız Mübarek Olsun! 🎉
        </div>
    </div>

    <script>
        function kurbaniKes() {
            const kurban = document.getElementById('kurban-alani');
            const buton = document.getElementById('kes-btn');
            const mesaj = document.getElementById('mesaj');
            const baslik = document.getElementById('baslik');

            // Butonu gizle ki tekrar tıklanmasın
            buton.style.display = 'none';
            baslik.innerText = "Bismillah... 🤲";

            // Koyunu döndürerek yok et
            kurban.classList.add('cut-animation');

            // 600ms sonra (koyun kaybolunca) eti getir
            setTimeout(() => {
                kurban.classList.remove('cut-animation');
                kurban.innerText = '🥩'; // Koyun ete dönüştü!
                kurban.classList.add('meat-animation');
                baslik.innerText = "Kurban Kesildi! Haneye Bereket! ✨";
                
                // Bayram mesajını göster
                mesaj.classList.add('show-message');

                // Komik konfeti patlaması
                let duration = 3 * 1000;
                let end = Date.now() + duration;

                (function frame() {
                    confetti({
                        particleCount: 5,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 }
                    });
                    confetti({
                        particleCount: 5,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 }
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());

            }, 600);
        }
    </script>

</body>
</html>
